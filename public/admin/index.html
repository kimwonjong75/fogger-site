<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      편집 화면은 검색결과에 뜨면 안 된다.
      robots.txt로 크롤링 자체를 막으면 크롤러가 이 태그를 읽지 못해 오히려 색인될 수 있으므로,
      크롤링은 열어 두고 여기서 막는다. 즉 이 한 줄이 유일한 방어선이라
      scripts/verify-build.mjs 가 이 태그의 존재를 검사한다.
    -->
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <title>블루가드 — 내용 편집</title>

    <style>
      /*
        미디어 지도로 가는 문.

        미디어 지도(/admin/media/)는 "이 사진이 어느 화면 어디에 쓰이는지"를 보는 유일한
        화면인데, 주소를 외워서 치지 않으면 갈 방법이 없었다. 편집 화면에서 사진을 바꾸다
        "이게 어디에 나오는 사진이지?" 싶을 때 바로 열 수 있어야 한다.

        편집기 DOM 을 건드리지 않고 우리 문서에 얹는다.
        Sveltia CMS 0.181.0 에는 메뉴에 항목을 더하는 API 가 없다(Decap 의
        registerAdditionalLink 가 번들에 없다). 편집기가 그려 놓은 화면을 나중에
        찾아 들어가 끼워 넣을 수도 있지만, 그러면 편집기 판을 올릴 때마다 조용히
        사라진다 — 사장님은 사라진 줄도 모른다. 우리 것으로 두면 편집기와 무관하다.

        자리는 왼쪽 아래다. 오른쪽 아래는 편집기 알림(toast)이 쌓이는 자리라 피했고,
        바닥 여백은 휴대폰에서 편집기 아래쪽 메뉴에 가리지 않도록 편집기가 쓰는
        --sui-bottom-navigation-height 를 그대로 따라간다.
        z-index 는 알림(99999)보다 낮게 둬서 알림을 가리지 않는다. 대화상자는
        <dialog> 라 z-index 와 무관하게 위에 뜬다.
      */
      .media-map-link {
        position: fixed;
        left: 16px;
        bottom: calc(var(--sui-bottom-navigation-height, 0px) + 16px);
        z-index: 90000;

        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        max-width: calc(100vw - 32px);
        padding: 0.6rem 1rem;
        border-radius: 12px;

        background: #004282;
        color: #fff;
        text-decoration: none;
        /* 사이트 글꼴(Pretendard)이 아니라 편집기 글꼴을 따라간다 — 이것은 사이트 화면이
           아니라 편집기 장치이므로, 편집기 안에서 따로 노는 것보다 섞이는 편이 낫다. */
        font-family: var(--sui-font-family-default, system-ui, 'Malgun Gothic', sans-serif);
        line-height: 1.4;
        word-break: keep-all;
        box-shadow: 0 6px 20px rgb(0 20 50 / 30%);
      }

      .media-map-link b {
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: -0.015em;
      }

      .media-map-link small {
        font-size: 0.76rem;
        color: #b9dcf5;
      }

      .media-map-link:hover,
      .media-map-link:focus-visible {
        background: #008fd5;
      }

      .media-map-link:hover small,
      .media-map-link:focus-visible small {
        color: #e8f5fd;
      }
    </style>
  </head>
  <body>
    <a class="media-map-link" href="/admin/media/">
      <b>🖼 미디어 지도 열기</b>
      <small>사진·영상이 어느 화면 어디에 쓰이는지</small>
    </a>

    <!--
      버전을 고정한다. @latest 로 두면 편집기가 사장님 모르게 바뀌고,
      그때 config.yml 과 어긋나면 편집 화면이 뜨지 않는다.
      올릴 때는 로컬에서 npm run dev 로 /admin/ 을 열어 확인한 뒤 올린다.
    -->
    <script src="https://unpkg.com/@sveltia/cms@0.181.0/dist/sveltia-cms.js"></script>
  </body>
</html>
