# 문서 편집 화면 설정 (Sveltia CMS)
#
# 여기 필드는 src/content.config.ts 의 zod 스키마를 화면 입력칸으로 옮긴 것이다.
# 스키마를 고치면 이 파일도 함께 고친다. 어긋나면 화면에서는 저장되는데 빌드가 깨진다.
#
# 목적: 빌드 시점에 잡히던 규칙(설명 70~80자, FAQ 4~6개 등)을 입력 시점에 막는 것.

backend:
  name: github
  repo: kimwonjong75/fogger-site

  # ⚠️ main 이 아니라 draft 다. 이게 이 설정에서 가장 중요한 한 줄이다.
  #
  # Decap CMS 의 publish_mode: editorial_workflow(저장하면 PR 생성)를 Sveltia CMS 는
  # 지원하지 않는다 — "구현하지 않을 기능"으로 명시돼 있다. 그대로 두면 편집 화면의 저장이
  # main 에 직행하고, 검증은 이미 들어간 뒤에 우는 경보가 된다.
  #
  # 그래서 편집 대상 브랜치를 draft 로 분리했다. 흐름은 이렇게 된다:
  #   편집 화면 저장 → draft 에 커밋 → open-draft-pr 워크플로가 draft→main PR 유지
  #   → verify 워크플로 통과 → 사장님이 PR에서 병합 → main 반영
  # 검증을 통과하지 못한 문서는 main 에 닿지 않는다.
  branch: draft

  # 로그인은 GitHub 개인 액세스 토큰(로그인 화면의 "Sign In Using Access Token")을 쓴다.
  # OAuth 중계 서버(Cloudflare Worker)를 따로 띄우지 않아도 되므로 base_url 을 두지 않는다.
  # 나중에 OAuth로 바꾸려면 base_url 에 중계 서버 주소를 넣으면 된다.

site_url: https://fogger.blueguard.kr
display_url: https://fogger.blueguard.kr

# 편집기 UI 언어. 지원하지 않는 값이면 영어로 되돌아갈 뿐 화면이 깨지지는 않는다.
locale: ko

# 본문 이미지는 넣지 않는다. 아래 "본문" 필드 설명 참조.
# (설정에 media_folder 가 없으면 편집기가 경고하므로 자리만 잡아 둔다)
media_folder: public/uploads
public_folder: /uploads

collections:
  # ------------------------------------------------------------------
  # 사용법
  #
  # 세 컬렉션의 입력칸은 완전히 같다 (같은 zod 스키마를 공유하므로).
  # 여기 fields 에 &doc_fields 앵커를 달고 아래 두 컬렉션에서 *doc_fields 로 재사용한다.
  # ------------------------------------------------------------------
  - name: guides
    label: 사용법
    label_singular: 사용법 문서
    folder: src/content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'guides/{{slug}}'
    summary: '{{title}}'
    fields: &doc_fields
      - name: title
        label: 제목
        widget: string
        hint: 검색결과에 뜨는 제목이자 페이지 맨 위 큰 글씨입니다. 30자를 넘으면 빌드가 실패합니다.
        pattern:
          ['^.{1,30}$', '제목은 30자 이내여야 합니다. 한글 검색결과는 30자 부근에서 잘립니다.']

      - name: description
        label: 요약 설명
        widget: text
        hint: 검색결과 본문이자 제목 아래 회색 글씨입니다. 반드시 70~80자 — 짧으면 내용이 안 보이고 길면 잘립니다.
        pattern: ['^[\s\S]{70,80}$', '요약 설명은 70자 이상 80자 이하여야 합니다.']

      - name: updatedDate
        label: 최종 수정일
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        hint: 내용을 실제로 고친 날로 바꿔 주세요. 검색엔진에 "언제 갱신됐는지"로 전달됩니다.

      - name: published
        label: 공개
        widget: boolean
        default: true
        hint: 끄면 주소 자체가 사라집니다 — 사이트맵·RSS·다른 문서의 링크에서도 모두 빠집니다.

      - name: reviewer
        label: 검수자
        widget: string
        hint: 이 내용을 확인한 사람 이름. 문서 하단 출처란에 표시됩니다.

      - name: ctaType
        label: 문서 맨 아래 안내 블록
        widget: select
        options:
          - { label: '제품 — 모델 비교·구매 안내', value: product }
          - { label: '소모품 — 매질·약제 안내 (지금은 화면에 안 나옴)', value: consumable }
          - { label: 'A/S — 문의 안내', value: as }
          - { label: '없음', value: none }
        hint: '"소모품"은 약제 승인번호가 확보되기 전까지 화면에 나오지 않습니다.'

      - name: showSpecTable
        label: 모델별 사양표 넣기
        widget: boolean
        default: false
        hint: 켜면 본문 아래에 탱크 용량·충전 한도 표가 자동으로 붙습니다. 본문에 숫자를 직접 쓰지 마세요.

      - name: videoKey
        label: 본문 영상
        widget: select
        required: false
        options:
          - { label: '분사 시험', value: sprayTest }
          - { label: '롱노즐 분사', value: longNozzle }
        hint: 문서 내용과 실제로 관련된 촬영본이 있을 때만 고르세요.

      - name: faq
        label: 자주 묻는 질문
        label_singular: 질문
        widget: list
        min: 4
        max: 6
        summary: '{{fields.q}}'
        hint: 반드시 4~6개. 화면에 보이는 그대로 검색엔진에도 전달되므로, 실제로 답이 되는 내용만 적으세요.
        fields:
          - { name: q, label: 질문, widget: string }
          - { name: a, label: 답변, widget: text }

      - name: sources
        label: 근거 출처
        label_singular: 출처
        widget: list
        required: false
        summary: '{{fields.name}}'
        hint: >-
          기관 홈 주소(예: https://www.kdca.go.kr/)만 걸면 독자가 근거를 확인할 수 없어
          출처가 없는 것과 같습니다. 그 내용이 실제로 적힌 문서를 직접 여는 주소를 넣으세요.
          못 찾겠으면 그 출처는 지우는 편이 낫습니다.
        fields:
          - name: name
            label: 문서 제목
            widget: string
            hint: '기관 이름 말고 문서 제목 — 예: "부탄캔 안전사용 요령"'
          - name: url
            label: 문서 주소
            widget: string
            pattern: ['^https?://', 'http:// 또는 https:// 로 시작하는 주소여야 합니다.']
          - { name: issuer, label: 발행 기관, widget: string, required: false }
          - name: docDate
            label: 발행일
            widget: string
            required: false
            pattern: ['^(\d{4}-\d{2}-\d{2})?$', 'YYYY-MM-DD 형식으로 적어 주세요.']
          - name: section
            label: 인용 위치
            widget: string
            required: false
            hint: '예: "제12조", "p.34"'

      - name: related
        label: 관련 문서
        widget: select
        multiple: true
        required: false
        max: 3
        hint: 비워 두면 같은 분류에서 자동으로 채웁니다. 비공개 문서를 고르면 조용히 건너뜁니다.
        options:
          - { label: '사용법 — 사용 후 세척', value: 'guides/after-use-cleaning' }
          - { label: '사용법 — 모델 고르기', value: 'guides/choose-fogger' }
          - { label: '사용법 — 매질 고르기', value: 'guides/choose-media' }
          - { label: '사용법 — 충전과 준비', value: 'guides/fill-and-prepare' }
          - { label: '사용법 — 연막기와 연무기 차이', value: 'guides/fogger-vs-mist-blower' }
          - { label: '사용법 — 점화와 분사', value: 'guides/ignition-and-spray' }
          - { label: '사용법 — 모기 방역', value: 'guides/mosquito-control' }
          - { label: '사용법 — 겨울철 사용', value: 'guides/winter-operation' }
          - { label: '활용사례 — 비닐하우스', value: 'uses/greenhouse' }
          - { label: '활용사례 — 축사', value: 'uses/livestock-barn' }
          - { label: '활용사례 — 지하주차장', value: 'uses/underground-parking' }
          - { label: '활용사례 — 창고', value: 'uses/warehouse' }
          - { label: '문제해결 — 점화 불량', value: 'troubleshooting/no-ignition' }
          - { label: '문제해결 — 노즐 막힘', value: 'troubleshooting/nozzle-clogged' }
          - { label: '문제해결 — 연막량 부족', value: 'troubleshooting/weak-smoke' }

      - name: body
        label: 본문
        widget: markdown
        hint: >-
          숫자(용량·충전 한도·가격)는 직접 쓰지 마세요 — 위의 "모델별 사양표 넣기"를 켜면
          제품 데이터에서 자동으로 채워집니다. 사진은 아직 여기에 넣을 수 없습니다
          (사이트 검사 규칙상 이미지에 크기와 대체텍스트가 필요한데 본문 이미지는 그걸 못 채웁니다).

  # ------------------------------------------------------------------
  # 활용사례
  # ------------------------------------------------------------------
  - name: uses
    label: 활용사례
    label_singular: 활용사례 문서
    folder: src/content/uses
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'uses/{{slug}}'
    summary: '{{title}}'
    fields: *doc_fields

  # ------------------------------------------------------------------
  # 문제해결
  # ------------------------------------------------------------------
  - name: troubleshooting
    label: 문제해결
    label_singular: 문제해결 문서
    folder: src/content/troubleshooting
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'troubleshooting/{{slug}}'
    summary: '{{title}}'
    fields: *doc_fields
