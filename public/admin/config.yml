# 편집 화면 설정 (Sveltia CMS)
#
# 여기 입력칸은 코드 쪽 검사 규칙을 화면으로 옮긴 것이다. 두 벌이 짝을 이룬다:
#
#   "화면 문구"  ↔  src/data/pages.ts       (zod 스키마)
#   "문서"       ↔  src/content.config.ts   (zod 스키마)
#
# 한쪽만 고치면 조용히 어긋난다. 어긋나는 방향은 둘 다 나쁘다.
#   규칙이 느슨해지면 → 화면에서는 저장되는데 빌드가 깨진다
#   규칙이 빡빡해지면 → 멀쩡한 기존 내용을 편집 화면이 거부해서 손을 못 댄다
# `scripts/verify-build.mjs` 가 이 어긋남을 검사한다.
#
# 목적: 빌드 시점에 잡히던 규칙(설명 70~80자, FAQ 4~6개 등)을 입력 시점에 막는 것.

backend:
  name: github
  repo: kimwonjong75/fogger-site

  # 저장하면 곧바로 사이트에 반영된다.
  #
  # 예전에는 draft 브랜치로 받아 PR을 거쳤다. 검증을 통과한 것만 main 에 들어가게 하려던
  # 것인데, 사장님이 매번 PR에서 [Merge] 를 눌러야 해서 "저장했는데 왜 안 바뀌지"가 됐다.
  #
  # 지금은 검증을 배포 과정 안으로 옮겼다 (vercel.json 의 buildCommand → npm run build:verify).
  # 저장 → main 커밋 → Vercel 이 빌드하면서 검증 → 통과해야만 배포.
  # 검증에 걸리면 배포가 일어나지 않고 사이트는 직전 버전 그대로 남는다.
  branch: main

  # 로그인은 GitHub 개인 액세스 토큰(로그인 화면의 "Sign In Using Access Token")을 쓴다.
  # OAuth 중계 서버(Cloudflare Worker)를 따로 띄우지 않아도 되므로 base_url 을 두지 않는다.
  # 나중에 OAuth로 바꾸려면 base_url 에 중계 서버 주소를 넣으면 된다.

site_url: https://fogger.blueguard.kr
display_url: https://fogger.blueguard.kr

# 편집기 UI 언어. 지원하지 않는 값이면 영어로 되돌아갈 뿐 화면이 깨지지는 않는다.
locale: ko

# 사진을 올리면 src/assets 에 들어간다.
#
# 이 폴더여야 하는 이유: 여기 있는 사진만 빌드할 때 자동으로 줄여지고 AVIF/WebP 로
# 바뀐다. public/ 에 올리면 원본이 그대로 나가서 휴대폰에서 느려진다.
# 저장되는 값은 "/src/assets/파일명" 이고, src/lib/assets.ts 가 이것을 실제 사진으로 바꾼다.
#
# 예외: 문서 **본문 안에** 넣는 사진만 src/content/uploads 로 간다.
# 이유는 그 폴더의 README.md 참조 (마크다운은 상대경로여야 최적화가 걸린다).
media_folder: src/assets
public_folder: /src/assets

# 오른쪽 미리보기 창을 끈다.
#
# 미리보기라고 하지만 실제 사이트 모양이 아니라 입력칸을 그대로 다시 늘어놓는 화면이라,
# 화면 절반을 쓰면서 아무것도 알려 주지 않는다. 끄면 입력칸이 화면 전체 폭을 쓴다.
# 실제 모양은 저장 후 사이트에서 확인하는 편이 정확하다.
editor:
  preview: false

collections:
  # ==================================================================
  # 화면 문구 — 방문자가 보는 각 화면의 글과 사진
  #
  # 값은 src/content/pages/*.json 에 있고 src/data/pages.ts 가 검사한다.
  #
  # 숫자를 직접 쓰지 않는 규칙이 이 묶음 전체에 걸린다. `{{충전한도}}` 처럼 적으면
  # 빌드할 때 제품 데이터의 실제 값으로 바뀐다. 사양이 바뀌었을 때 화면 문구만
  # 옛 숫자로 남는 것을 막기 위한 장치다.
  # ==================================================================
  - name: pages
    label: 화면 문구
    icon: web
    files:
      # ----------------------------------------------------------------
      # 홈
      # ----------------------------------------------------------------
      - name: home
        label: 홈 화면
        file: src/content/pages/home.json
        description: 주소창에 fogger.blueguard.kr 만 쳤을 때 나오는 첫 화면입니다.
        fields:
          - name: hero
            label: 첫 화면 (맨 위 파란 영역)
            widget: object
            fields:
              - name: eyebrow
                label: 큰 제목 위 작은 글씨
                widget: string
                hint: &token_hint >-
                  숫자는 직접 쓰지 마세요. {{국산비율}} {{충전한도}} {{기본형탱크}} {{대용량탱크}}
                  {{분사모드}} {{가열원}} {{매질}} {{기본형}} {{대용량}} {{롱노즐구성}}
                  {{작업기준량}} {{작업시간}} {{작업면적}} 처럼 적으면 제품 데이터의 실제 값이
                  자동으로 들어갑니다. 없는 이름을 쓰면 저장은 되지만 사이트에 반영되지 않습니다.
              - { name: headlineTop, label: 큰 제목 — 첫 줄, widget: string }
              - name: headlineAccent
                label: 큰 제목 — 둘째 줄 (파란 그러데이션)
                widget: string
                hint: 두 줄로 나뉘어 보이는 제목의 아랫줄입니다. 강조하고 싶은 말을 여기 두세요.
              - name: lede
                label: 소개 문구
                widget: list
                field: { name: line, label: 한 줄, widget: string }
                hint: 한 줄씩 추가합니다. 화면에서는 줄이 나뉘어 보입니다.
              - { name: videoButtonLabel, label: 왼쪽 버튼 글씨, widget: string }
              - { name: modelButtonLabel, label: 오른쪽 버튼 글씨, widget: string }
              - name: specLine
                label: 버튼 아래 사양 한 줄
                widget: string
                hint: *token_hint
              - name: image
                label: 오른쪽 제품 사진
                widget: image
                media_folder: /src/assets
                public_folder: /src/assets
                hint: &photo_hint >-
                  세로로 긴 사진이 잘 맞습니다. 올리면 자동으로 크기가 줄고 형식이 바뀌므로
                  원본 그대로 올리셔도 됩니다. 사진을 바꾸면 아래 "사진 설명"도 함께 고쳐 주세요.
              - name: imageAlt
                label: 사진 설명
                widget: string
                hint: &alt_hint >-
                  눈이 안 보이는 분과 검색엔진이 읽는 유일한 설명입니다.
                  "{무엇} — {어떤 장면}" 형식으로 적어 주세요(가운데 줄표 앞뒤에 빈칸).
                  예: 블루가드 연막소독기 대용량 — 흰 연료통과 스테인리스 배럴이 보이는 본체 사진
                pattern:
                  ['^.+ — .+$', '"{무엇} — {어떤 장면}" 형식으로 적어 주세요. 예: 제품 사진 — 마당에서 분사하는 장면']

          - name: works
            label: 현장 사진 섹션
            widget: object
            fields:
              - { name: heading, label: 섹션 제목, widget: string }
              - { name: desc, label: 제목 아래 한 줄, widget: string }
              - name: image
                label: 왼쪽 현장 사진
                widget: image
                media_folder: /src/assets
                public_folder: /src/assets
                hint: *photo_hint
              - { name: imageAlt, label: 사진 설명, widget: string, hint: *alt_hint }
              - name: benefits
                label: 사진 옆 근거 목록
                label_singular: 근거
                widget: list
                min: 1
                max: 4
                summary: '{{fields.title}}'
                hint: 문단 대신 이 목록으로 읽힙니다. 1~4개까지 넣을 수 있습니다.
                fields:
                  - { name: title, label: 굵은 글씨, widget: string, hint: *token_hint }
                  - { name: body, label: 설명, widget: string, hint: *token_hint }
              - name: moreLinks
                label: 섹션 아래 링크
                label_singular: 링크
                widget: list
                required: false
                summary: '{{fields.label}}'
                fields: &nav_link_fields
                  - { name: label, label: 링크 글씨, widget: string }
                  - name: href
                    label: 주소
                    widget: string
                    hint: 사이트 안의 주소만 넣습니다. 슬래시로 시작해서 슬래시로 끝나야 합니다. 예 — /guides/
                    pattern:
                      ['^/([\w가-힣-]+/)*$', '슬래시로 시작해서 슬래시로 끝나는 사이트 안 주소여야 합니다. 예 — /guides/']

          - name: parts
            label: 부품 섹션 (어두운 영역)
            widget: object
            hint: 네 칸의 부품 사진과 설명 자체는 "제품 정보 → 부품 사양" 에서 고칩니다.
            fields:
              - { name: heading, label: 섹션 제목, widget: string }
              - { name: desc, label: 제목 아래 한 줄, widget: string }
              - { name: closing, label: 섹션 맨 아래 마무리 한 줄, widget: string }

          - name: models
            label: 모델 섹션
            widget: object
            fields:
              - { name: heading, label: 섹션 제목, widget: string }
              - { name: desc, label: 제목 아래 한 줄, widget: string, hint: *token_hint }
              - name: moreLinks
                label: 섹션 아래 링크
                label_singular: 링크
                widget: list
                required: false
                summary: '{{fields.label}}'
                fields: *nav_link_fields

          - name: closing
            label: 맨 아래 마무리 섹션
            widget: object
            fields:
              - { name: heading, label: 섹션 제목, widget: string }
              - { name: desc, label: 제목 아래 한 줄, widget: string }
              - name: safetyBoxTitle
                label: 노란 안전 상자 제목
                widget: string
                hint: 상자 안의 항목은 "안전수칙 화면"에서 함께 관리됩니다.
              - { name: safetyLinkLabel, label: 안전수칙 링크 글씨, widget: string }
              - name: moreLinks
                label: 맨 아래 링크
                label_singular: 링크
                widget: list
                required: false
                summary: '{{fields.label}}'
                fields: *nav_link_fields

          - name: seo
            label: 검색결과 표기
            widget: object
            hint: 네이버·구글 검색결과에 이 화면이 어떻게 뜰지 정합니다.
            fields: &seo_fields
              - name: title
                label: 검색결과 제목
                widget: string
                hint: 35자를 넘기지 마세요. 한글 검색결과는 30자 부근에서 잘립니다.
                pattern: ['^.{1,35}$', '검색결과 제목은 35자 이내여야 합니다.']
              - name: description
                label: 검색결과 설명
                widget: text
                hint: 40~80자. 70~80자가 가장 좋습니다 — 짧으면 내용이 안 보이고 길면 잘립니다.
                pattern: ['^[\s\S]{40,90}$', '검색결과 설명은 40~90자여야 합니다.']

      # ----------------------------------------------------------------
      # 제품 목록
      # ----------------------------------------------------------------
      - name: products
        label: 제품 목록 화면
        file: src/content/pages/products.json
        description: fogger.blueguard.kr/products/ — 세 구성을 나란히 보여주는 화면입니다.
        fields:
          - { name: eyebrow, label: 제목 위 작은 글씨, widget: string }
          - { name: heading, label: 큰 제목, widget: string }
          - { name: lede, label: 제목 아래 소개 문구, widget: text, hint: *token_hint }

          - name: partsHeading
            label: 부품 사양 — 섹션 제목
            widget: string
          - name: partsDesc
            label: 부품 사양 — 제목 아래 한 줄
            widget: string
            hint: *token_hint
          - name: partsCheckLabel
            label: 부품 사양 — "확인법" 앞머리 글씨
            widget: string
            hint: 각 부품 설명 맨 아래 줄 앞에 붙는 말입니다. 부품 내용 자체는 "제품 정보 → 부품 사양" 에서 고칩니다.

          - { name: commonHeading, label: 공통 사양표 — 제목, widget: string }
          - name: commonFacts
            label: 공통 사양표 — 항목
            label_singular: 항목
            widget: list
            min: 1
            summary: '{{fields.label}}'
            fields: &fact_row_fields
              - { name: label, label: 항목 이름, widget: string }
              - { name: value, label: 값, widget: string, hint: *token_hint }
              - name: note
                label: 부연설명
                widget: string
                required: false
                hint: 비워 두면 값만 표시됩니다.
          - { name: commonFootnote, label: 공통 사양표 — 표 아래 주석, widget: string }

          - { name: videoHeading, label: 촬영본 — 섹션 제목, widget: string }
          - name: videoDesc
            label: 촬영본 — 제목 아래 한 줄
            widget: string
            hint: 어떤 영상이 붙는지는 코드에서 정합니다. 영상을 바꾸려면 알려 주세요.

          - name: moreLink
            label: 맨 아래 링크
            widget: object
            fields: *nav_link_fields

          - { name: seo, label: 검색결과 표기, widget: object, fields: *seo_fields }

      # ----------------------------------------------------------------
      # 모델비교
      # ----------------------------------------------------------------
      - name: compare
        label: 모델비교 화면
        file: src/content/pages/compare.json
        description: fogger.blueguard.kr/compare/ — 세 구성의 차이를 표로 보여주는 화면입니다.
        fields:
          - { name: eyebrow, label: 제목 위 작은 글씨, widget: string }
          - { name: heading, label: 큰 제목, widget: string, hint: *token_hint }
          - { name: lede, label: 제목 아래 소개 문구, widget: text }

          - name: specTableCaption
            label: 비교표 — 표 제목
            widget: string
            hint: *token_hint
          - name: specTableFootnote
            label: 비교표 — 표 아래 주석
            widget: text
            hint: *token_hint

          - { name: pickerHeading, label: 고르는 기준 — 섹션 제목, widget: string }
          - name: pickerDetailLabel
            label: 고르는 기준 — 각 칸의 링크 글씨
            widget: string
            hint: 칸 안의 탱크 용량·주요 사용처는 "제품 정보 → 모델" 에서 고칩니다.

          - { name: summaryHeading, label: 한 줄 요약 — 섹션 제목, widget: string }
          - name: summary
            label: 한 줄 요약 — 항목
            label_singular: 요약
            widget: list
            min: 1
            field:
              name: line
              label: 한 줄
              widget: string
            hint: >-
              **별표 두 개** 로 감싼 부분이 굵게 나옵니다. 예 — 한 공간을 짧게 처리한다면
              **{{기본형}}**. 가볍고 준비가 빠릅니다.

          - name: safetyBoxTitle
            label: 노란 안전 상자 제목
            widget: string
            hint: 상자 안의 항목은 "안전수칙 화면"에서 함께 관리됩니다.

          - { name: seo, label: 검색결과 표기, widget: object, fields: *seo_fields }

      # ----------------------------------------------------------------
      # 연무기
      #
      # 「연무기」로 검색하면 원리가 다른 기계 셋이 섞여 나온다. 이 화면의 첫째 일은
      # 제품을 파는 것이 아니라 "어느 쪽을 찾고 있는지" 갈라 주는 것이다.
      # ----------------------------------------------------------------
      - name: mist
        label: 연무기 화면
        file: src/content/pages/mist.json
        description: fogger.blueguard.kr/mist/ — 「연무기」로 검색해서 들어온 분에게 방식 차이를 갈라 주는 화면입니다.
        fields:
          - { name: eyebrow, label: 제목 위 작은 글씨, widget: string }
          - { name: heading, label: 큰 제목, widget: string }
          - { name: lede, label: 제목 아래 소개 문구, widget: text }

          - { name: answerHeading, label: 짧은 답 — 섹션 제목, widget: string }
          - name: answer
            label: 짧은 답 — 문단
            label_singular: 문단
            widget: list
            min: 1
            field: { name: line, label: 한 문단, widget: text }
            hint: >-
              검색해서 들어온 분이 **첫 화면에서 바로 판단**할 수 있게 적는 자리입니다.
              "우리 제품이 아닌 경우"를 숨기지 말고 함께 적어 주세요 — 잘못 들어온 분이
              헤매지 않고, 검색 AI 도 우리를 다른 기계로 잘못 배우지 않습니다.
              **별표 두 개**로 감싸면 굵게 나옵니다. {{가열원}} 같은 자리표시자를 쓸 수 있습니다.

          - { name: methodsHeading, label: 방식 비교 — 섹션 제목, widget: string }
          - { name: methodsDesc, label: 방식 비교 — 제목 아래 한 줄, widget: string, hint: *token_hint }
          - name: methods
            label: 방식 비교 — 표의 각 줄
            label_singular: 방식
            widget: list
            min: 2
            summary: '{{fields.name}}'
            hint: 타사 제품 이름이 아니라 **방식 이름**을 적습니다. 특정 회사를 비교 대상으로 삼는 것과 다릅니다.
            fields:
              - { name: name, label: 방식 이름, widget: string }
              - { name: particle, label: 입자 크기, widget: string }
              - { name: power, label: 동력, widget: string, hint: *token_hint }
              - name: ours
                label: 이 제품이 쓰는 방식
                widget: boolean
                default: false
                hint: 켠 줄만 표에서 강조되고 "이 제품" 표시가 붙습니다. **한 줄만 켜세요.**
              - { name: detail, label: 설명, widget: text, hint: *token_hint }

          - { name: switchHeading, label: 연막·연무 전환 — 섹션 제목, widget: string }
          - name: switchDesc
            label: 연막·연무 전환 — 설명
            widget: text
            hint: >-
              아래 매질 표는 "제품 정보 → 매질"에서 자동으로 채워집니다.
              **별표 두 개**로 감싸면 굵게 나옵니다.

          - { name: faqHeading, label: 자주 묻는 것 — 섹션 제목, widget: string }
          - name: faq
            label: 자주 묻는 것 — 문답
            label_singular: 문답
            widget: list
            min: 1
            summary: '{{fields.q}}'
            hint: 사람들이 실제로 검색창에 치는 말 그대로 질문을 적으면 검색·AI 가 그대로 인용합니다.
            fields:
              - { name: q, label: 질문, widget: string }
              - { name: a, label: 답, widget: text, hint: *token_hint }

          - name: safetyBoxTitle
            label: 노란 안전 상자 제목
            widget: string
            hint: 상자 안의 항목은 "안전수칙 화면"에서 함께 관리됩니다.

          - name: moreLinks
            label: 맨 아래 링크
            label_singular: 링크
            widget: list
            required: false
            summary: '{{fields.label}}'
            fields: *nav_link_fields

          - { name: seo, label: 검색결과 표기, widget: object, fields: *seo_fields }

      # ----------------------------------------------------------------
      # 안전수칙
      #
      # ⚠️ 이 화면의 문구는 화기·고온·밀폐공간 위험을 다룬다. 연막소독기는 부탄가스를
      #    연소시키는 기기라 여기 문구를 약하게 고치면 실제 사고로 이어질 수 있다.
      #    지우기 전에 "이 문장이 없으면 무엇을 모르게 되는가"를 먼저 따진다.
      # ----------------------------------------------------------------
      - name: safety
        label: 안전수칙 화면
        file: src/content/pages/safety.json
        description: >-
          fogger.blueguard.kr/safety/ — 여기 적은 안전 규칙은 홈·사용법·문제해결 화면의
          노란 상자에도 함께 나옵니다. 한 곳만 고치면 전부 바뀝니다.
        fields:
          - { name: heading, label: 큰 제목, widget: string }
          - { name: lede, label: 제목 아래 소개 문구, widget: text }
          - { name: printButtonLabel, label: 인쇄 버튼 글씨, widget: string }

          - { name: limitsHeading, label: 기본 한계값 — 섹션 제목, widget: string }
          - { name: limitsCaption, label: 기본 한계값 — 표 제목, widget: string }
          - name: limits
            label: 기본 한계값 — 항목
            label_singular: 항목
            widget: list
            min: 1
            summary: '{{fields.label}}'
            fields: *fact_row_fields

          - { name: rulesHeading, label: 지켜야 할 것 — 섹션 제목, widget: string }
          - name: rules
            label: 지켜야 할 것 — 규칙
            label_singular: 규칙
            widget: list
            min: 1
            summary: '{{fields.title}}'
            hint: >-
              여기 규칙이 안전수칙 화면과 다른 화면의 노란 상자에 함께 나옵니다.
              fill-limit · aux-inlet · venue · heat 네 개는 다른 화면이 이름으로 불러다 쓰고
              있어서 지우면 그 화면들의 안전 안내가 사라집니다.
            fields:
              - name: id
                label: 이름표
                widget: string
                hint: >-
                  화면에는 안 보이지만 다른 화면이 이 규칙을 찾는 열쇠입니다.
                  기존 규칙의 이름표는 바꾸지 마세요. 영문 소문자와 붙임표(-)만 씁니다.
                pattern: ['^[a-z][a-z-]*$', '영문 소문자와 붙임표(-)만 쓸 수 있습니다. 예 — fill-limit']
              - name: level
                label: 등급
                widget: select
                options:
                  - { label: '필수 — 어기면 사고로 이어짐 (빨간 테두리)', value: critical }
                  - { label: '주의 — 지키지 않으면 문제가 생김 (노란 테두리)', value: warning }
              - { name: title, label: 규칙 제목, widget: string, hint: *token_hint }
              - { name: body, label: 설명, widget: text, hint: *token_hint }

          - { name: dontHeading, label: 하지 말아야 할 것 — 섹션 제목, widget: string }
          - name: dont
            label: 하지 말아야 할 것 — 항목
            label_singular: 항목
            widget: list
            min: 1
            field: { name: line, label: 한 줄, widget: string }

          - { name: fillTableHeading, label: 모델별 충전 한도 — 섹션 제목, widget: string }
          - { name: fillTableCaption, label: 모델별 충전 한도 — 표 제목, widget: string }
          - name: fillTableFootnote
            label: 모델별 충전 한도 — 표 아래 주석
            widget: string
            hint: 표의 숫자는 제품 데이터에서 자동으로 채워집니다.

          - { name: emergencyHeading, label: 이상이 생겼을 때 — 섹션 제목, widget: string }
          - name: emergencySteps
            label: 이상이 생겼을 때 — 조치 순서
            label_singular: 단계
            widget: list
            min: 1
            field: { name: line, label: 한 단계, widget: string }
            hint: 순서대로 번호가 붙습니다. 마지막 문의 안내는 아래 두 칸으로 자동으로 붙습니다.
          - { name: emergencyContactPrefix, label: 문의 안내 — 이메일 주소 앞 글씨, widget: string }
          - { name: emergencyContactSuffix, label: 문의 안내 — 이메일 주소 뒤 글씨, widget: string }
          - name: emergencyNote
            label: 이상이 생겼을 때 — 맨 아래 굵은 한 줄
            widget: text

          - { name: seo, label: 검색결과 표기, widget: object, fields: *seo_fields }

      # ----------------------------------------------------------------
      # 문서 목록 화면 셋
      #
      # 앞의 네 화면과 성격이 달라(문서를 모아 보여주는 자리) 구분선을 넣는다.
      # ----------------------------------------------------------------
      - divider: true
        name: _divider_index_pages

      - name: guides_index
        label: 사용법 목록 화면
        file: src/content/pages/guides.json
        description: fogger.blueguard.kr/guides/ — 사용법 문서들의 목록 화면입니다.
        fields:
          - &collection_label_field
            name: label
            label: 메뉴에 뜨는 짧은 이름
            widget: string
            hint: 화면 위 메뉴와 이동 경로 표시에 쓰입니다. 짧게 적어 주세요.
          - &collection_heading_field
            name: heading
            label: 큰 제목
            widget: string
          - &collection_lede_field
            name: lede
            label: 제목 아래 소개 문구
            widget: text
            hint: 화면에도 나오고 검색결과 설명으로도 쓰입니다. 40~90자, 70~80자를 권합니다.
            pattern: ['^[\s\S]{40,90}$', '40~90자여야 합니다.']
          - name: safetyBoxTitle
            label: 노란 안전 상자 제목
            widget: string
            hint: 상자 안의 항목은 "안전수칙 화면"에서 함께 관리됩니다.
          - { name: howtoHeading, label: 10단계 — 섹션 제목, widget: string }
          - name: howtoDesc
            label: 10단계 — 제목 아래 안내
            widget: text
            hint: >-
              10단계의 내용 자체는 소개 영상의 자막을 그대로 옮긴 것이라 이 화면에서 바꾸지 않습니다.
              영상을 다시 찍으면 함께 고쳐야 하므로 알려 주세요.
          - { name: docsHeading, label: 문서 목록 — 섹션 제목, widget: string }
          - &more_text_field
            name: moreText
            label: 맨 아래 안내 문구
            widget: text
            hint: >-
              [글씨](/주소/) 형식으로 링크를 넣습니다. 예 — 증상별 점검이 필요하면
              [문제해결](/troubleshooting/) 을 참고하세요. 사이트 안의 주소만 넣을 수 있습니다.
          - &seo_title_only_field
            name: seo
            label: 검색결과 표기
            widget: object
            hint: 검색결과 설명은 위의 "제목 아래 소개 문구"를 그대로 씁니다.
            fields:
              - name: title
                label: 검색결과 제목
                widget: string
                pattern: ['^.{1,35}$', '검색결과 제목은 35자 이내여야 합니다.']

      - name: uses_index
        label: 활용사례 목록 화면
        file: src/content/pages/uses.json
        description: fogger.blueguard.kr/uses/ — 장소별 활용사례 문서들의 목록 화면입니다.
        fields:
          - *collection_label_field
          - *collection_heading_field
          - *collection_lede_field
          - *more_text_field
          - *seo_title_only_field

      - name: troubleshooting_index
        label: 문제해결 목록 화면
        file: src/content/pages/troubleshooting.json
        description: fogger.blueguard.kr/troubleshooting/ — 증상별 문제해결 문서들의 목록 화면입니다.
        fields:
          - *collection_label_field
          - *collection_heading_field
          - *collection_lede_field
          - name: safetyBoxTitle
            label: 노란 안전 상자 제목
            widget: string
            hint: 상자 안의 항목은 "안전수칙 화면"에서 함께 관리됩니다.
          - { name: asHeading, label: A/S 안내 — 제목, widget: string }
          - { name: asBody, label: A/S 안내 — 본문, widget: text }
          - name: asContactSuffix
            label: A/S 안내 — 이메일 주소 뒤 글씨
            widget: string
            hint: 이메일 주소는 사업자 정보에서 자동으로 들어갑니다.
          - *seo_title_only_field

  # ==================================================================
  # 제품 정보 — 사양 · 가격 · 부품 · 매질
  #
  # 값은 src/content/data/products.json, 검사는 src/data/products.ts.
  #
  # ⚠️ 여기 숫자는 화면 여러 곳에 동시에 나간다. 탱크 용량을 고치면 제품 카드·비교표·
  #    안전수칙의 최대 충전량이 한꺼번에 바뀐다. 공식 상세페이지 원문을 확인하고 넣는다.
  # ==================================================================
  - name: product_data
    label: 제품 정보
    icon: inventory_2
    files:
      - name: models
        label: 모델 (사양 · 가격 · 사진)
        file: src/content/data/products.json
        description: >-
          세 구성의 사양과 가격입니다. 여기를 고치면 제품 카드·모델비교표·제품 상세가
          한꺼번에 바뀝니다. 공식몰 상세페이지 표기와 글자 단위로 맞춰 주세요.
        fields:
          - name: models
            label: 모델
            label_singular: 모델
            widget: list
            min: 1
            summary: '{{fields.officialLabel}}'
            fields:
              - name: id
                label: 주소에 쓰는 이름
                widget: string
                hint: >-
                  ⚠️ 이 값이 제품 페이지 주소가 됩니다 (예: bf-102 → /products/bf-102/).
                  이미 있는 모델의 값은 바꾸지 마세요 — 검색결과와 외부 링크가 전부 끊깁니다.
                pattern: ['^[a-z0-9][a-z0-9-]*$', '영문 소문자·숫자·붙임표(-)만 쓸 수 있습니다.']
              - name: officialLabel
                label: 구성 이름 (공식 옵션명)
                widget: string
                hint: >-
                  공식몰 옵션 드롭다운 표기와 **글자 단위로 같아야** 합니다. 고객이 주문할 때
                  보는 이름과 다르면 같은 제품인지 확인이 안 됩니다. 내부 모델번호(BF-…)는
                  쓰지 마세요 — 화면에 나가면 배포가 막힙니다.
              - { name: name, label: 전체 이름, widget: string, hint: 검색결과와 구조화데이터에 쓰는 긴 이름입니다. }
              - name: seoTitle
                label: 검색결과 제목
                widget: string
                hint: >-
                  ⚠️ 세 구성이 **서로 다른 말로 시작해야** 합니다. 같은 말로 시작하면 검색엔진이
                  셋 중 하나만 올리고 나머지 둘은 버립니다. 그 구성을 찾는 사람이 실제로 치는 말을
                  앞에 두세요 — 기본형은 "소형·미니", 대용량은 "대용량·대형", 롱노즐은 "롱노즐".
                  35자 이내이고, 내부 모델번호(BF-…)는 쓰지 마세요.
                pattern: ['^.{1,35}$', '검색결과 제목은 35자 이내여야 합니다.']
              - name: tagline
                label: 한 줄 소개
                widget: string
                hint: 사용 장소를 권하지 말고 사양 차이로만 설명해 주세요.
              - name: tankLiters
                label: 탱크 용량 (L)
                widget: number
                value_type: float
                step: 0.1
                hint: ⚠️ 최대 충전량이 이 값에서 자동으로 계산됩니다. 안전 수치이므로 상세페이지 사양표를 확인하고 넣으세요.
              - name: dimensionsMm
                label: 크기 (mm)
                widget: string
                hint: '가로×세로×높이. 예 — 465×265×180 (× 는 곱하기 기호입니다)'
                pattern: ['^\d+×\d+×\d+$', '465×265×180 형식으로 적어 주세요.']
              - { name: nozzle, label: 노즐 구성, widget: string }
              - { name: sprayMode, label: 분사 방식, widget: string }
              - { name: shoulderStrap, label: 어깨끈 포함, widget: boolean, default: false }
              - { name: longNozzle, label: 롱노즐 포함, widget: boolean, default: false }
              - name: includes
                label: 구성품
                label_singular: 구성품
                widget: list
                field: { name: item, label: 품목, widget: string }
                hint: 상세페이지 "구성품" 표기 그대로 적어 주세요.
              - name: bestFor
                label: 주요 사용처
                label_singular: 사용처
                widget: list
                field: { name: item, label: 사용처, widget: string }
                hint: 실내·실외를 단정하는 표현은 쓰지 마세요. 장소는 매질과 환기 조건이 함께 정합니다.
              - name: priceKrw
                label: 공식몰 정가 (원)
                widget: number
                value_type: int
                required: false
                hint: >-
                  ⚠️ 공식몰 옵션별 판매가와 정확히 같아야 합니다. 한 모델이라도 비우면
                  화면에서 **전 모델 가격이 함께 숨겨집니다** — 일부만 보이면 "이 모델만 비싸다"로 읽히기 때문입니다.
              - name: basedOn
                label: 기준 모델
                widget: string
                required: false
                hint: 번들 구성이면 바탕이 되는 모델의 "주소에 쓰는 이름"을 넣습니다. 아니면 비워 두세요.
              - name: image
                label: 제품 사진
                widget: image
                media_folder: /src/assets
                public_folder: /src/assets
                hint: >-
                  정사각형(1:1) 사진이 잘 맞습니다. 세 모델을 같은 배경·조명·거리로 찍어야
                  나란히 놓았을 때 어긋나지 않습니다.
              - name: imageAlt
                label: 사진 설명
                widget: string
                hint: '"{무엇} — {어떤 장면}" 형식 (가운데 줄표 앞뒤에 빈칸).'
                pattern: ['^.+ — .+$', '"{무엇} — {어떤 장면}" 형식으로 적어 주세요.']

          - name: common
            label: 전 모델 공통 사양
            widget: object
            fields:
              - { name: productType, label: 제품 형식, widget: string }
              - { name: heatSource, label: 가열원, widget: string }
              - { name: sprayModes, label: 분사 모드, widget: string }
              - { name: efficacy, label: 효능, widget: string }
              - { name: storage, label: 보관 방법, widget: string }
              - name: fillRatioPercent
                label: 충전 한도 (%)
                widget: number
                value_type: int
                min: 50
                max: 95
                hint: >-
                  ⚠️ 안전 수치입니다. 가열하면 매질이 팽창하므로 가득 채우면 넘치거나 역류합니다.
                  95%를 넘겨 넣을 수 없게 막아 두었습니다. 모델별 최대 충전량이 이 값으로 계산됩니다.
              - name: domesticPartsPercent
                label: 부품 국산 비율 (%)
                widget: number
                value_type: int
                min: 0
                max: 100
                hint: >-
                  "국내 조립"과 "부품 100% 국산"은 전혀 다른 주장입니다.
                  100 미만으로 내리면 화면 문구도 함께 낮춰야 합니다.
              - { name: meshThicknessMm, label: 철망 두께 (mm), widget: number, value_type: float, step: 0.1 }
              - { name: coilTempC, label: 가열부 도달 온도 (℃), widget: number, value_type: int }

          - name: useVenue
            label: 사용 장소
            widget: object
            hint: >-
              장소는 세 가지가 겹쳐 정해집니다 — 매질(실내 가능 여부) · 가열원(환기 조건) ·
              약제 표시사항(허용 대상). "실내 사용 가능"만 단독으로 쓰면 나머지 둘이 사라져
              위험한 문장이 됩니다.
            fields:
              - { name: label, label: 사양표 한 줄 표기, widget: string }
              - name: condition
                label: 항상 함께 붙는 조건
                widget: text
                hint: ⚠️ 매질과 무관하게 언제나 적용되는 환기 조건입니다. 비우거나 약하게 고치지 마세요.

          - name: workReference
            label: 작업 기준량
            widget: object
            hint: >-
              공식 상세페이지의 "1,500ml로 약 30분 · 300평" 표기입니다.
              **탱크 용량이 아닙니다** — 이 값을 용량으로 오해한 검색 답변이 있었기 때문에
              화면에서는 아래 주석을 항상 함께 보여 줍니다.
            fields:
              - { name: chargeMl, label: 기준 충전량 (mL), widget: number, value_type: int }
              - { name: minutes, label: 작업 시간 (분), widget: number, value_type: int }
              - { name: pyeong, label: 작업 면적 (평), widget: number, value_type: int }
              - { name: note, label: 함께 붙는 주석, widget: text }

          - name: shipping
            label: 배송
            widget: object
            fields:
              - { name: label, label: 배송 표기, widget: string }
              - name: note
                label: 배송 조건
                widget: text
                hint: >-
                  ⚠️ 비우면 배포가 막힙니다. "무료배송"만 단독으로 쓰면 도서·산간 추가비와
                  반품 배송비를 고지하지 않은 것이 되어 표시광고 문제가 됩니다.

          - name: buildQuality
            label: 부품 사양 (홈 어두운 영역)
            label_singular: 부품
            widget: list
            min: 1
            summary: '{{fields.part}}'
            hint: >-
              홈 어두운 영역과 제품 목록에 함께 나가는 부품 설명입니다.
              각 부품의 "확인법"은 사장님이 직접 눈으로 확인하는 방법을 적어 주세요.
            fields:
              - name: id
                label: 이름표
                widget: string
                hint: 화면에는 안 보입니다. 기존 부품의 이름표는 바꾸지 마세요.
                pattern: ['^[a-z][a-z-]*$', '영문 소문자와 붙임표(-)만 쓸 수 있습니다.']
              - { name: part, label: 부품 이름, widget: string }
              - { name: claim, label: 굵게 나오는 한 줄, widget: string, hint: *token_hint }
              - { name: detail, label: 설명, widget: text, hint: *token_hint }
              - name: howToCheck
                label: 확인법
                widget: text
                hint: >-
                  우리 제품이 아니어도 쓸 수 있는 **일반적인 육안 확인법**으로 적어 주세요.
                  "우리 것이 낫다"가 아니라 "이렇게 확인하세요"여야 비교 주장이 되지 않습니다.
              - name: image
                label: 부품 사진
                widget: image
                required: false
                media_folder: /src/assets
                public_folder: /src/assets
                hint: 정사각형(1:1). 사진이 없으면 홈의 네 칸에는 나오지 않고 제품 목록에만 글로 나옵니다.
              - name: imageAlt
                label: 사진 설명
                widget: string
                required: false
                hint: '사진을 넣었으면 반드시 채워 주세요. "{무엇} — {어떤 장면}" 형식.'
                pattern: ['^(.+ — .+)?$', '"{무엇} — {어떤 장면}" 형식으로 적어 주세요.']

          - name: mediaSpecs
            label: 사용 가능 매질
            label_singular: 매질
            widget: list
            min: 1
            summary: '{{fields.name}}'
            hint: >-
              ⚠️ 여기 "실내 가능" 표시가 안전수칙과 직결됩니다. 경유는 기름 성분과 연소 잔류물이
              남아 실외 전용입니다. 켜고 끄기 전에 근거를 확인하세요.
            fields:
              - name: id
                label: 이름표
                widget: string
                pattern: ['^[a-z][a-z-]*$', '영문 소문자와 붙임표(-)만 쓸 수 있습니다.']
              - { name: name, label: 매질 이름, widget: string }
              - { name: mode, label: 분사 모드, widget: string, hint: '예 — 연막 / 연무' }
              - name: indoor
                label: 실내 사용 가능
                widget: boolean
                default: false
                hint: ⚠️ 켜도 환기 조건은 그대로 적용됩니다 — 가열원이 연소이기 때문입니다.
              - { name: venueLabel, label: 장소 표기, widget: string, hint: '예 — 실외 전용 / 실내·실외' }
              - { name: detail, label: 설명, widget: text }

          - name: designFeatures
            label: 설계 특징
            label_singular: 특징
            widget: list
            min: 1
            summary: '{{fields.title}}'
            hint: 공식 상세페이지 표기 그대로 옮깁니다. 마케팅 수식어를 덧붙이지 마세요.
            fields:
              - { name: title, label: 특징, widget: string }
              - { name: detail, label: 설명, widget: string }

      - divider: true
        name: _divider_howto

      - name: howto
        label: 사용법 10단계
        file: src/content/data/howto.json
        description: >-
          /guides/ 화면의 사용 순서입니다. 번호는 순서대로 자동으로 붙습니다.
        fields:
          - name: steps
            label: 단계
            label_singular: 단계
            widget: list
            min: 1
            summary: '{{fields.title}}'
            hint: >-
              ⚠️ 이 문구는 **소개 영상의 자막을 그대로 옮긴 것**입니다. 글만 고치면 영상에서는
              다르게 말하는 상태가 됩니다. 검색엔진에도 "절차"로 함께 나가므로 화면·영상·검색이
              어긋나면 절차 인식이 깨집니다. 영상을 다시 찍을 때 함께 고치는 것이 안전합니다.
            fields:
              - { name: title, label: 단계 이름, widget: string }
              - { name: body, label: 설명, widget: text }
          - name: approval
            label: 검토 표기
            widget: object
            hint: 10단계 목록 아래에 "누가 언제 확인했는지"로 표시됩니다.
            fields:
              - name: appliesTo
                label: 적용 구성
                label_singular: 구성
                widget: list
                required: false
                field: { name: item, label: 구성 이름, widget: string }
                hint: 비워 두면 제품 정보의 구성 이름을 순서대로 가져옵니다. 비워 두시는 편을 권합니다.
              - { name: approvedBy, label: 검토한 사람, widget: string, required: false }
              - name: approvedDate
                label: 검토일
                widget: string
                required: false
                pattern: ['^(\d{4}-\d{2}-\d{2})?$', 'YYYY-MM-DD 형식으로 적어 주세요.']

  # ==================================================================
  # 문서 — 사용법 · 활용사례 · 문제해결
  #
  # 세 묶음의 입력칸은 완전히 같다 (같은 zod 스키마를 공유하므로).
  # 여기 fields 에 &doc_fields 앵커를 달고 아래 두 묶음에서 *doc_fields 로 재사용한다.
  # ==================================================================
  - name: guides
    label: 사용법
    icon: menu_book
    label_singular: 사용법 문서
    folder: src/content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'guides/{{slug}}'
    summary: '{{title}}'
    fields: &doc_fields
      - name: title
        label: 제목
        widget: string
        hint: 검색결과에 뜨는 제목이자 페이지 맨 위 큰 글씨입니다. 30자를 넘으면 빌드가 실패합니다.
        pattern:
          ['^.{1,30}$', '제목은 30자 이내여야 합니다. 한글 검색결과는 30자 부근에서 잘립니다.']

      - name: description
        label: 요약 설명
        widget: text
        hint: 검색결과 본문이자 제목 아래 회색 글씨입니다. 반드시 70~80자 — 짧으면 내용이 안 보이고 길면 잘립니다.
        pattern: ['^[\s\S]{70,80}$', '요약 설명은 70자 이상 80자 이하여야 합니다.']

      - name: updatedDate
        label: 최종 수정일
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        hint: 내용을 실제로 고친 날로 바꿔 주세요. 검색엔진에 "언제 갱신됐는지"로 전달됩니다.

      - name: published
        label: 공개
        widget: boolean
        default: true
        hint: 끄면 주소 자체가 사라집니다 — 사이트맵·RSS·다른 문서의 링크에서도 모두 빠집니다.

      - name: reviewer
        label: 검수자
        widget: string
        hint: 이 내용을 확인한 사람 이름. 문서 하단 출처란에 표시됩니다.

      - name: ctaType
        label: 문서 맨 아래 안내 블록
        widget: select
        options:
          - { label: '제품 — 모델 비교·구매 안내', value: product }
          - { label: '소모품 — 매질·약제 안내 (지금은 화면에 안 나옴)', value: consumable }
          - { label: 'A/S — 문의 안내', value: as }
          - { label: '없음', value: none }
        hint: '"소모품"은 약제 승인번호가 확보되기 전까지 화면에 나오지 않습니다.'

      - name: showSpecTable
        label: 모델별 사양표 넣기
        widget: boolean
        default: false
        hint: 켜면 본문 아래에 탱크 용량·충전 한도 표가 자동으로 붙습니다. 본문에 숫자를 직접 쓰지 마세요.

      - name: videoKey
        label: 본문 영상
        widget: select
        required: false
        options:
          - { label: '분사 시험', value: sprayTest }
          - { label: '롱노즐 분사', value: longNozzle }
        hint: 문서 내용과 실제로 관련된 촬영본이 있을 때만 고르세요.

      - name: faq
        label: 자주 묻는 질문
        label_singular: 질문
        widget: list
        min: 4
        max: 6
        summary: '{{fields.q}}'
        hint: 반드시 4~6개. 화면에 보이는 그대로 검색엔진에도 전달되므로, 실제로 답이 되는 내용만 적으세요.
        fields:
          - { name: q, label: 질문, widget: string }
          - { name: a, label: 답변, widget: text }

      - name: sources
        label: 근거 출처
        label_singular: 출처
        widget: list
        required: false
        summary: '{{fields.name}}'
        hint: >-
          기관 홈 주소(예: https://www.kdca.go.kr/)만 걸면 독자가 근거를 확인할 수 없어
          출처가 없는 것과 같습니다. 그 내용이 실제로 적힌 문서를 직접 여는 주소를 넣으세요.
          못 찾겠으면 그 출처는 지우는 편이 낫습니다.
        fields:
          - name: name
            label: 문서 제목
            widget: string
            hint: '기관 이름 말고 문서 제목 — 예: "부탄캔 안전사용 요령"'
          - name: url
            label: 문서 주소
            widget: string
            pattern: ['^https?://', 'http:// 또는 https:// 로 시작하는 주소여야 합니다.']
          - { name: issuer, label: 발행 기관, widget: string, required: false }
          - name: docDate
            label: 발행일
            widget: string
            required: false
            pattern: ['^(\d{4}-\d{2}-\d{2})?$', 'YYYY-MM-DD 형식으로 적어 주세요.']
          - name: section
            label: 인용 위치
            widget: string
            required: false
            hint: '예: "제12조", "p.34"'

      - name: related
        label: 관련 문서
        widget: select
        multiple: true
        required: false
        max: 3
        hint: 비워 두면 같은 분류에서 자동으로 채웁니다. 비공개 문서를 고르면 조용히 건너뜁니다.
        options:
          - { label: '사용법 — 사용 후 세척', value: 'guides/after-use-cleaning' }
          - { label: '사용법 — 모델 고르기', value: 'guides/choose-fogger' }
          - { label: '사용법 — 매질 고르기', value: 'guides/choose-media' }
          - { label: '사용법 — 충전과 준비', value: 'guides/fill-and-prepare' }
          - { label: '사용법 — 연막기와 연무기 차이', value: 'guides/fogger-vs-mist-blower' }
          - { label: '사용법 — 점화와 분사', value: 'guides/ignition-and-spray' }
          - { label: '사용법 — 모기 방역', value: 'guides/mosquito-control' }
          - { label: '사용법 — 겨울철 사용', value: 'guides/winter-operation' }
          - { label: '활용사례 — 비닐하우스', value: 'uses/greenhouse' }
          - { label: '활용사례 — 축사', value: 'uses/livestock-barn' }
          - { label: '활용사례 — 지하주차장', value: 'uses/underground-parking' }
          - { label: '활용사례 — 창고', value: 'uses/warehouse' }
          - { label: '문제해결 — 점화 불량', value: 'troubleshooting/no-ignition' }
          - { label: '문제해결 — 노즐 막힘', value: 'troubleshooting/nozzle-clogged' }
          - { label: '문제해결 — 연막량 부족', value: 'troubleshooting/weak-smoke' }

      - name: body
        label: 본문
        widget: markdown
        # 본문 사진만 다른 폴더로 간다.
        # Astro 는 마크다운 사진을 "문서 파일 기준 상대경로"로 적었을 때만 최적화하는데,
        # 문서들이 전부 같은 깊이(src/content/{묶음}/파일.md)라서 이 폴더를 문서 옆에 두면
        # `../uploads/사진.jpg` 하나로 모든 문서에서 맞는다. 자세한 것은 그 폴더의 README.md.
        media_folder: /src/content/uploads
        public_folder: ../uploads
        hint: >-
          숫자(용량·충전 한도·가격)는 직접 쓰지 마세요 — 위의 "모델별 사양표 넣기"를 켜면
          제품 데이터에서 자동으로 채워집니다.
          사진은 도구모음의 사진 단추로 넣습니다. 넣을 때 **설명(alt)을 반드시 채워 주세요** —
          "{무엇} — {어떤 장면}" 형식이어야 하고(가운데 줄표 앞뒤에 빈칸), 비거나 형식이 다르면
          저장은 되지만 사이트에 반영되지 않습니다.

  - name: uses
    label: 활용사례
    icon: location_on
    label_singular: 활용사례 문서
    folder: src/content/uses
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'uses/{{slug}}'
    summary: '{{title}}'
    fields: *doc_fields

  - name: troubleshooting
    label: 문제해결
    icon: build
    label_singular: 문제해결 문서
    folder: src/content/troubleshooting
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: 'troubleshooting/{{slug}}'
    summary: '{{title}}'
    fields: *doc_fields
