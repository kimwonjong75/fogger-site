# 산출물 검증 — 무엇이 왜 깨졌는지 보여주는 화면.
#
# **배포를 막는 것은 이 워크플로가 아니다.** 배포를 막는 것은 Vercel 이고, vercel.json 이
# 빌드 명령을 `npm run build:verify` 로 잡아 둔 덕분에 검증에 걸리면 배포 자체가 일어나지
# 않는다(사이트는 직전 버전 그대로 남는다).
#
# 그런데 Vercel 빌드 로그는 사장님이 열어 볼 자리가 아니다. 그래서 같은 검증을 여기서도
# 돌려, GitHub 커밋 목록에 초록불·빨간불로 남기고 무엇이 걸렸는지 한국어로 보여 준다.
# 공개 저장소라 실행 시간은 무료다 — 저장을 자주 해도 요금이 붙지 않는다.
#
# 검증이 잡는 것: 내부 모델 번호 노출, "무료배송" 조건 고지 누락, 사진 설명 형식 위반,
#                깨진 링크, 페이지 용량 초과, 편집 화면 설정과 실제 내용의 어긋남 등.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# CMS 저장은 잦으므로 같은 브랜치의 앞선 실행은 취소한다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 빌드 + 산출물 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: ">=22.12.0"
          node-version: '22.12'
          cache: npm

      - run: npm ci

      # npm run build:verify = astro check && astro build && scripts/verify-build.mjs
      # 세 단계를 나눠 실행해 PR에서 어느 단계가 깨졌는지 바로 보이게 한다.
      - name: 타입 검사
        run: npm run check

      - name: 빌드
        run: npm run build

      - name: 산출물 검증
        run: npm run verify
