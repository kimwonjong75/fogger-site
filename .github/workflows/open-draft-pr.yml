# draft → main 게시 요청 PR을 항상 열어 둔다.
#
# 왜 필요한가:
#   /admin/ 편집 화면(Sveltia CMS)은 저장하면 draft 브랜치에 바로 커밋한다.
#   Decap CMS 의 editorial_workflow(저장하면 PR 생성)를 Sveltia 는 지원하지 않기 때문이다.
#   그래서 PR을 사람이 만들지 않아도 되도록 여기서 대신 만든다.
#
# 결과적으로 사장님이 보는 흐름은 이렇게 된다:
#   편집 화면에서 저장 → 이 워크플로가 PR 생성/갱신 → verify 워크플로가 검사
#   → PR이 초록불이면 [Merge] → main 반영 → 배포
name: open-draft-pr

on:
  push:
    branches: [draft]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: 게시 요청 PR 열기
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PR 생성 (이미 열려 있으면 그대로 둔다)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 이미 열린 draft→main PR이 있으면 push 로 자동 갱신되므로 아무것도 하지 않는다.
          # `// empty` 가 없으면 PR이 없을 때 jq 가 "null" 을 찍어 항상 "있다"로 판정된다.
          existing=$(gh pr list --base main --head draft --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "이미 열린 PR #$existing 이 있습니다. 이번 커밋은 그 PR에 반영됩니다."
            exit 0
          fi

          gh pr create \
            --base main \
            --head draft \
            --title "문서 수정 게시 요청" \
            --body "$(cat <<'BODY'
          `/admin/` 편집 화면에서 저장한 내용입니다.

          **아래 검사가 모두 초록불이 된 뒤에 Merge 를 눌러 주세요.**
          빨간불이면 무엇이 잘못됐는지 검사 결과에 한글로 나옵니다. 그 항목을 편집 화면에서
          고치고 다시 저장하면 이 PR이 자동으로 갱신되고 검사도 다시 돕니다.

          Merge 하면 `main` 에 반영됩니다. 실제 사이트 배포는 기존대로 별도 절차입니다.
          BODY
          )"
